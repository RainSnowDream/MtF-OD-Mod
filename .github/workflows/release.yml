name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build fabric
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fabric
          path: build/libs/*.jar

  build-neoforge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        working-directory: neoforge
        run: chmod +x ./gradlew
      - name: build neoforge
        working-directory: neoforge
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge
          path: neoforge/build/libs/*.jar

  release:
    needs: [build-fabric, build-neoforge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            artifacts/**/*.jar
