name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 想加什么功能？它能解决什么问题？
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 其他方案（可选）
      description: 你考虑过的替代方案
