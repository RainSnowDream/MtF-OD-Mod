license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/mtfodmod/icon.png"
authors="RainSnowDream"
description='''
一个警示药物滥用与过量（OD，Overdose）危害的 Minecraft NeoForge 模组。
内容仅供公益/教育用途，不构成用药指导。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
